<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 星星猫娘 · 桌宠挂件</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* 果冻弹性与阻尼动画（单缓出曲线，移除无意义循环抖动） */
    .jelly-pet {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
      touch-action: none;
      cursor: grab;
    }
    .jelly-pet.grabbing {
      cursor: grabbing;
      transform: scale(0.92, 1.1) !important;
      transition: transform 0.08s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }
    .jelly-pet.flipped {
      transform: scaleX(-1);
    }
    .jelly-pet.flipped.grabbing {
      transform: scaleX(-1) scale(0.92, 1.1) !important;
    }

    /* 任务完成弹性反馈（单次触达后即停） */
    @keyframes duangEffect {
      0% { transform: scale(1); }
      35% { transform: scale(1.16, 0.86); }
      70% { transform: scale(0.94, 1.08); }
      100% { transform: scale(1); }
    }
    .duang-active {
      animation: duangEffect 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
    }
    .flipped.duang-active {
      animation: duangEffect 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
    }
  </style>
</head>
<body class="bg-transparent text-[#ededed] min-h-screen overflow-hidden p-4 antialiased font-sans select-none">
  
  <div id="container" class="relative w-full h-screen flex flex-col justify-between">
    
    <!-- 顶部极简状态栏（Graphite 中性阶 + 4px 栅格） -->
    <header class="flex justify-between items-center px-3 py-2 rounded-lg bg-[#141415]/95 border border-white/10 text-xs">
      <div class="flex items-center gap-2">
        <span id="agent-state-dot" class="w-1.5 h-1.5 rounded-full bg-[#4cc38a]"></span>
        <span id="agent-state-text" class="font-medium text-[#ededed]">星星猫娘待命</span>
      </div>
      <div class="flex items-center gap-2 font-mono text-[11px] text-[#a1a1a6] tabular-nums">
        <span id="hud-token">Token: 42k</span>
        <button onclick="triggerDuang()" title="预览完成反馈" class="px-2 py-1 rounded bg-[#232325] border border-white/10 text-[#ededed] hover:bg-[#2c2c2f] transition-colors font-sans text-[11px]">
          预览完成
        </button>
      </div>
    </header>

    <!-- 悬浮桌宠挂件核心主体 -->
    <div id="floating-pet" 
         class="jelly-pet absolute bottom-5 right-5 w-40 flex flex-col items-center z-30 select-none">
      
      <!-- 气泡对话框 -->
      <div id="pet-bubble" class="opacity-0 transition-opacity duration-200 pointer-events-none mb-1 px-3 py-1.5 rounded-lg bg-[#fafafa] border border-black/10 shadow-sm text-xs text-[#171717] font-medium text-center whitespace-nowrap">
        任务已完成，点击即可查看详情
      </div>

      <!-- 角色立绘主体 -->
      <div id="pet-avatar-wrap" class="relative group">
        <video id="pet-video" autoplay loop muted playsinline preload="auto" src="/assets/gemini/idle/motion.webm" class="w-32 h-36 object-contain pointer-events-none drop-shadow-md"></video>
        <img id="pet-img" 
             src="/assets/idle.png" 
             alt="Gemini Star Catgirl" 
             class="w-32 h-36 object-contain pointer-events-none drop-shadow-md hidden">
        
        <!-- 线性状态角标 -->
        <div id="status-badge" class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-[#19191b] border border-white/20 flex items-center justify-center text-[#a1a1a6] shadow-sm">
        </div>
      </div>

      <!-- 肚皮悬浮条 -->
      <div class="mt-1 px-2.5 py-1 rounded-md bg-[#fafafa] border border-black/10 text-[11px] font-mono tabular-nums text-[#171717] shadow-sm flex items-center gap-1.5">
        <span id="badge-dot" class="inline-block w-1.5 h-1.5 rounded-full bg-[#16a34a]"></span>
        <span id="pet-token-pill">Token: 42k</span>
      </div>

    </div>

  </div>

  <script>
    const pet = document.getElementById('floating-pet');
    const container = document.getElementById('container');
    const petImg = document.getElementById('pet-img');
    const bubble = document.getElementById('pet-bubble');
    const statusBadge = document.getElementById('status-badge');
    const badgeDot = document.getElementById('badge-dot');
    const hudToken = document.getElementById('hud-token');
    const petTokenPill = document.getElementById('pet-token-pill');
    const stateDot = document.getElementById('agent-state-dot');
    const stateText = document.getElementById('agent-state-text');

    const BADGE_SVGS = {
      idle: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/></svg>',
      thinking: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      coding: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
      celebrate: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      warning: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    };
    statusBadge.innerHTML = BADGE_SVGS.idle;

    const sprites = {
      idle: "/assets/idle.png",
      thinking: "/assets/thinking.png",
      coding: "/assets/coding.png",
      celebrate: "/assets/celebrate.png",
      warning: "/assets/warning.png"
    };

    function clearAnimations() {
      pet.classList.remove('duang-active');
    }

    function applyState(data) {
      const state = data.state || 'idle';
      const detail = data.detail || '';
      clearAnimations();

      const actionMap = {
        idle: 'idle',
        thinking: 'reviewing',
        coding: 'working',
        celebrate: 'jump',
        warning: 'emotion-frightened',
        wave: 'wave',
        starry: 'emotion-starry',
        cheerful: 'emotion-cheerful',
        shy: 'emotion-shy',
        confused: 'emotion-confused'
      };
      const actFolder = actionMap[state] || state;
      const petVideo = document.getElementById('pet-video');
      if (petVideo) {
        petVideo.src = `/assets/gemini/${actFolder}/motion.webm`;
        petVideo.play().catch(() => {});
        petVideo.classList.remove('hidden');
        petImg.classList.add('hidden');
      } else if (sprites[state]) {
        petImg.src = sprites[state];
      }

      if (data.tokens) {
        hudToken.textContent = `Token: ${data.tokens}`;
        petTokenPill.textContent = `Token: ${data.tokens}`;
      }

      switch(state) {
        case 'thinking':
          statusBadge.innerHTML = BADGE_SVGS.thinking;
          statusBadge.style.borderColor = 'rgba(237, 237, 237, 0.28)';
          statusBadge.style.color = '#ededed';
          stateDot.className = "w-1.5 h-1.5 rounded-full bg-[#a1a1a6]";
          stateText.textContent = "思考中";
          showBubble(detail || "让本喵想想怎么写更合适", 2200);
          break;
        case 'coding':
          statusBadge.innerHTML = BADGE_SVGS.coding;
          statusBadge.style.borderColor = 'rgba(56, 189, 248, 0.55)';
          statusBadge.style.color = '#38bdf8';
          stateDot.className = "w-1.5 h-1.5 rounded-full bg-[#38bdf8]";
          stateText.textContent = "处理任务中";
          showBubble(detail || "正在全速敲键盘输出中", 2200);
          break;
        case 'celebrate':
          statusBadge.innerHTML = BADGE_SVGS.celebrate;
          statusBadge.style.borderColor = 'rgba(76, 195, 138, 0.6)';
          statusBadge.style.color = '#4cc38a';
          stateDot.className = "w-1.5 h-1.5 rounded-full bg-[#4cc38a]";
          stateText.textContent = "任务已完成";
          pet.classList.add('duang-active');
          showBubble(detail || "任务搞定啦，快来验收吧", 3200);
          break;
        case 'warning':
          statusBadge.innerHTML = BADGE_SVGS.warning;
          statusBadge.style.borderColor = 'rgba(229, 72, 77, 0.7)';
          statusBadge.style.color = '#e5484d';
          stateDot.className = "w-1.5 h-1.5 rounded-full bg-[#e5484d]";
          stateText.textContent = "上下文水位达 80%";
          showBubble(detail || "上下文已偏高，建议执行 /compact", 3500);
          break;
        default: // idle
          statusBadge.innerHTML = BADGE_SVGS.idle;
          statusBadge.style.borderColor = 'rgba(237, 237, 237, 0.2)';
          statusBadge.style.color = '#a1a1a6';
          stateDot.className = "w-1.5 h-1.5 rounded-full bg-[#4cc38a]";
          stateText.textContent = "星星猫娘待命";
          break;
      }
    }

    // 拖拽手感算法 (Squash & Stretch)
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    pet.addEventListener('pointerdown', (e) => {
      isDragging = true;
      pet.classList.add('grabbing');
      pet.classList.remove('duang-active');
      const petRect = pet.getBoundingClientRect();
      offsetX = e.clientX - petRect.left;
      offsetY = e.clientY - petRect.top;
      pet.setPointerCapture(e.pointerId);
    });

    pet.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      let newLeft = e.clientX - offsetX;
      let newTop = e.clientY - offsetY;

      newLeft = Math.max(10, Math.min(window.innerWidth - pet.offsetWidth - 10, newLeft));
      newTop = Math.max(10, Math.min(window.innerHeight - pet.offsetHeight - 10, newTop));

      pet.style.left = `${newLeft}px`;
      pet.style.top = `${newTop}px`;
      pet.style.bottom = 'auto';
      pet.style.right = 'auto';
    });

    pet.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      pet.classList.remove('grabbing');

      // 弹性吸附边缘 (Snap to edge)
      const screenWidth = window.innerWidth;
      const currentLeft = pet.offsetLeft;
      const petWidth = pet.offsetWidth;

      if (currentLeft + petWidth / 2 < screenWidth / 2) {
        // 吸附左侧并水平翻转
        pet.style.left = '16px';
        pet.classList.add('flipped');
      } else {
        // 吸附右侧常规朝向
        pet.style.left = `${screenWidth - petWidth - 16}px`;
        pet.classList.remove('flipped');
      }
    });

    function showBubble(text, duration = 2400) {
      bubble.textContent = text;
      bubble.style.opacity = '1';
      setTimeout(() => {
        bubble.style.opacity = '0';
      }, duration);
    }

    function triggerDuang() {
      applyState({ state: 'celebrate', detail: '任务已完成，可以验收啦' });
    }

    // 连接 SSE 实时状态流
    function setupSSE() {
      const evtSource = new EventSource('/events');
      evtSource.onmessage = function(e) {
        try {
          const data = JSON.parse(e.data);
          applyState(data);
        } catch (err) {}
      };
      evtSource.onerror = function() {
        // 断开时回退到轮询
        setTimeout(pollState, 2000);
      };
    }

    function pollState() {
      fetch('/api/state')
        .then(res => res.json())
        .then(data => {
          applyState(data);
          setTimeout(pollState, 1500);
        })
        .catch(() => setTimeout(pollState, 3000));
    }

    // 初始化
    setupSSE();
  </script>
</body>
</html>
